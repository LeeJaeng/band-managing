name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT }}
          script: |
            set -e
            cd /home/ubuntu/band-managing

            echo "== current commit =="
            git rev-parse HEAD || true

            echo "== pulling latest =="
            git pull origin main

            echo "== deployed commit =="
            git rev-parse HEAD

            echo "== rebuilding containers =="
            docker compose up -d --build

            echo "== compose status =="
            docker compose ps

            echo "== health check =="
            ok=0
            for i in {1..18}; do
              if docker compose exec -T api python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); print(r.status)"; then
                ok=1
                echo "api container health check passed"
                break
              fi
              echo "waiting for api service... ($i/18)"
              sleep 5
            done

            if [ "$ok" -ne 1 ]; then
              echo "health check failed"
              echo "== nginx logs =="
              docker compose logs --tail=80 nginx || true
              echo "== api logs =="
              docker compose logs --tail=80 api || true
              echo "== web logs =="
              docker compose logs --tail=80 web || true
              exit 1
            fi

            echo "== nginx check =="
            curl -fsS http://localhost/api/health || true

            echo "== deploy done =="